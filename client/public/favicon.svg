<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#0369a1" />
  <!-- Optical fiber outer cladding ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" />
  <!-- Optical fiber core ring -->
  <circle cx="32" cy="32" r="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <!-- Laser beam propagating along axis -->
  <circle cx="32" cy="32" r="6" fill="#dc2626" />
  <!-- Fiber axis guidance lines -->
  <line x1="8" y1="32" x2="26" y2="32" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
  <line x1="38" y1="32" x2="56" y2="32" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" />
</svg>
